# hakimi-proxy configuration
# Copy to config.yaml and fill in your credentials.

host: 127.0.0.1
port: 12345
auth_token: "your-secret-bearer-token"
max_retries: 3
cooldown_seconds: 60
db_path: hakimi.db

# Explicit upstream proxy for Google APIs (e.g. socks5://127.0.0.1:1080).
# Leave empty for automatic environment/system/GNOME detection, then direct.
# Requires httpx[socks] for SOCKS proxies.
proxy: ""

# AI Studio credentials (API Key mode)
aistudio:
  - id: acct1-proj1
    api_key: "AIzaSy..."
    project: "my-project-1"
    account: "user@gmail.com"
  - id: acct1-proj2
    api_key: "AIzaSy..."
    project: "my-project-2"
    account: "user@gmail.com"

# Antigravity credentials (OAuth mode)
# Use only credentials obtained through an OAuth flow you control.
# After that, access_token is auto-refreshed silently.
antigravity:
  - id: acct2-antigravity
    account: "user@gmail.com" # optional; browser OAuth fills this automatically
    client_id: "xxx.apps.googleusercontent.com"
    client_secret: "GOCSPX-xxx"
    refresh_token: "1//xxx"
    access_token: ""     # filled automatically after first refresh
    expires_at: 0        # 0 = will refresh on first use
    project: ""          # discovered with loadCodeAssist when empty
    auto_onboard: false   # explicit opt-in; onboarding changes account state

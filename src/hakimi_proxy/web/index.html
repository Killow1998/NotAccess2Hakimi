<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NA2H</title>
<script>
try {
  const savedTheme = localStorage.getItem('na2h-theme');
  document.documentElement.dataset.theme = ['system', 'light', 'dark'].includes(savedTheme) ? savedTheme : 'system';
} catch (error) { document.documentElement.dataset.theme = 'system'; }
</script>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface-2: #1c2330; --border: #30363d;
  --text: #e6edf3; --muted: #8b949e; --blue: #58a6ff; --blue-bg: #1f3b5b;
  --green: #3fb950; --yellow: #d29922; --red: #f85149; --radius: 8px;
  --success-text: #aff5b4; --warning-text: #e3b341; --error-text: #ffb4ae;
  --subtle-surface: rgba(255,255,255,.015); --embedded-surface: rgba(0,0,0,.12);
  --quota-surface: rgba(13,17,23,.52); --overlay: rgba(0,0,0,.7);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f8fa; --surface: #ffffff; --surface-2: #f3f4f6; --border: #d0d7de;
  --text: #1f2328; --muted: #59636e; --blue: #0969da; --blue-bg: #ddf4ff;
  --green: #1a7f37; --yellow: #9a6700; --red: #cf222e;
  --success-text: #116329; --warning-text: #7d4e00; --error-text: #a40e26;
  --subtle-surface: rgba(31,35,40,.025); --embedded-surface: rgba(31,35,40,.035);
  --quota-surface: rgba(255,255,255,.72); --overlay: rgba(31,35,40,.45);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    --bg: #f6f8fa; --surface: #ffffff; --surface-2: #f3f4f6; --border: #d0d7de;
    --text: #1f2328; --muted: #59636e; --blue: #0969da; --blue-bg: #ddf4ff;
    --green: #1a7f37; --yellow: #9a6700; --red: #cf222e;
    --success-text: #116329; --warning-text: #7d4e00; --error-text: #a40e26;
    --subtle-surface: rgba(31,35,40,.025); --embedded-surface: rgba(31,35,40,.035);
    --quota-surface: rgba(255,255,255,.72); --overlay: rgba(31,35,40,.45);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
button, input, select { font: inherit; }
button { cursor: pointer; border: 0; border-radius: 6px; padding: 8px 13px; transition: opacity .15s, border-color .15s; }
button:hover:not(:disabled) { opacity: .85; }
button:disabled { cursor: wait; opacity: .55; }
input, textarea, select { width: 100%; padding: 8px 10px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; }
textarea { min-height: 74px; resize: vertical; font: 12px/1.45 var(--mono); overflow-wrap: anywhere; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 12px; font-weight: 600; }
a { color: var(--blue); }
.hidden { display: none !important; }
.btn-primary { color: #fff; background: #238636; }
.btn-blue { color: #fff; background: #1f6feb; }
.btn-ghost { color: var(--text); background: transparent; border: 1px solid var(--border); }
.btn-danger { color: #fff; background: var(--red); }
.login-wrap { display: grid; min-height: 100vh; place-items: center; padding: 20px; }
.login-box { width: min(380px, 100%); padding: 30px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.login-box h1 { margin: 0 0 5px; font-size: 22px; }
.login-box p { margin: 0 0 20px; color: var(--muted); }
.login-box input { margin-bottom: 12px; }
.preferences { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
.login-preferences { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--border); }
.preference-control { min-width: 116px; margin: 0; }
.preference-control span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 600; }
.preference-control select { min-width: 116px; padding: 6px 28px 6px 8px; font-size: 12px; }
.remember-login { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.remember-login input { width: auto; margin: 0; }
.app { width: min(1180px, 100%); margin: 0 auto; padding: 30px 24px 52px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.eyebrow { margin: 0 0 3px; color: var(--blue); font: 700 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.topbar h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.02em; }
.subtitle { margin: 6px 0 0; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.service { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 99px; font-size: 12px; }
.service-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }
.service.online .service-dot { background: var(--green); }
.service.offline .service-dot { background: var(--red); }
.endpoint { margin: 14px 0 0; color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
.stat, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.stat { padding: 15px 16px; }
.stat-label { margin-bottom: 5px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.stat-value { font-size: 23px; font-weight: 700; }
.stat-sub { color: var(--muted); font-size: 11px; }
.panel { margin-top: 16px; padding: 20px; }
.onboarding { border-color: #315f8f; background: linear-gradient(135deg, rgba(31,111,235,.11), var(--surface) 55%); }
.onboarding.ready { border-color: rgba(63,185,80,.55); background: linear-gradient(135deg, rgba(63,185,80,.10), var(--surface) 55%); }
.onboarding h2 { margin: 0 0 5px; font-size: 17px; }
.onboarding p { margin: 0; color: var(--muted); }
.onboarding .actions { margin-top: 14px; justify-content: flex-start; }
.integration-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.integration-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--embedded-surface); }
.integration-item span { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.integration-item code { font: 12px/1.5 var(--mono); overflow-wrap: anywhere; }
.panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.panel-header h2 { margin: 0; font-size: 17px; }
.panel-header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.provider-block + .provider-block { margin-top: 23px; padding-top: 22px; border-top: 1px solid var(--border); }
.provider-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.provider-heading h3 { margin: 0; font-size: 14px; }
.provider-heading span { color: var(--muted); font-size: 12px; }
.credential-list { display: grid; gap: 9px; }
.credential-card { padding: 13px 14px; border: 1px solid var(--border); border-radius: 7px; background: var(--subtle-surface); }
.credential-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.credential-name { margin-bottom: 4px; font-weight: 650; }
.credential-meta { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
.credential-meta span + span::before { content: "·"; margin-right: 8px; color: var(--border); }
.credential-runtime { margin-top: 9px; color: var(--muted); font-size: 11px; }
.credential-runtime .runtime-error { color: var(--error-text); }
.quota-panel { position: relative; overflow: hidden; margin-top: 12px; padding: 15px; border: 1px solid rgba(88,166,255,.24); border-radius: 10px; background: linear-gradient(135deg, rgba(88,166,255,.09), rgba(46,160,67,.035)); }
.quota-panel::after { content: ""; position: absolute; width: 150px; height: 150px; right: -70px; top: -95px; border-radius: 50%; background: rgba(88,166,255,.09); filter: blur(1px); pointer-events: none; }
.quota-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; position: relative; z-index: 1; }
.quota-kicker { color: var(--blue); font: 700 10px var(--mono); letter-spacing: .11em; text-transform: uppercase; }
.quota-title { margin-top: 3px; font-size: 14px; font-weight: 700; }
.quota-source { color: var(--muted); font: 10px var(--mono); white-space: nowrap; }
.quota-windows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 14px; position: relative; z-index: 1; }
.quota-window { padding: 12px; border: 1px solid rgba(139,148,158,.19); border-radius: 8px; background: var(--quota-surface); }
.quota-window-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.quota-window-label { color: var(--text); font-size: 12px; font-weight: 650; }
.quota-window-value { font: 750 18px var(--mono); }
.quota-progress-track { height: 9px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: rgba(139,148,158,.18); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
.quota-progress-fill { height: 100%; border-radius: inherit; transition: width .3s ease; }
.quota-good .quota-window-value { color: var(--success-text); }
.quota-good .quota-progress-fill { background: linear-gradient(90deg, #238636, #56d364); }
.quota-warn .quota-window-value { color: var(--warning-text); }
.quota-warn .quota-progress-fill { background: linear-gradient(90deg, #9e6a03, #d29922); }
.quota-critical .quota-window-value { color: var(--error-text); }
.quota-critical .quota-progress-fill { background: linear-gradient(90deg, #b62324, #f85149); }
.quota-reset { margin-top: 7px; color: var(--muted); font-size: 10px; }
.quota-meta { margin-top: 10px; color: var(--muted); font-size: 10px; }
.quota-fallback { margin-top: 11px; padding: 10px 11px; border-radius: 7px; color: var(--warning-text); background: rgba(210,153,34,.09); font-size: 11px; line-height: 1.5; }
.credential-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.credential-actions button { padding: 6px 10px; font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 650; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-active { color: var(--green); background: rgba(63,185,80,.12); }
.badge-cooldown { color: var(--yellow); background: rgba(210,153,34,.12); }
.badge-disabled { color: var(--red); background: rgba(248,81,73,.12); }
.badge-unknown { color: var(--muted); background: rgba(139,148,158,.12); }
.test-result { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
.test-result.ok { color: var(--success-text); background: rgba(63,185,80,.12); }
.test-result.error { color: var(--error-text); background: rgba(248,81,73,.12); }
.verification-result { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.verification-result button { flex-shrink: 0; }
.empty { padding: 25px 10px; color: var(--muted); text-align: center; }
.empty p { margin: 5px 0 0; font-size: 12px; }
details summary { cursor: pointer; color: var(--text); font-weight: 650; }
details summary::marker { color: var(--blue); }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 17px; }
.form-group.full { grid-column: 1 / -1; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 8px 10px; color: var(--muted); border-bottom: 1px solid var(--border); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
td { padding: 10px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.modal-overlay { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; background: var(--overlay); z-index: 10; }
.modal-overlay.show { display: grid; }
.modal { width: min(520px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 20px 70px rgba(0,0,0,.4); }
.modal h2 { margin: 0 0 5px; font-size: 18px; }
.modal-note { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
.modal .form-group { margin-top: 13px; }
.modal .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.secret-note { margin-top: 5px; color: var(--muted); font-size: 11px; }
.modal-status { min-height: 20px; margin-top: 12px; color: var(--red); font-size: 12px; }
.checkbox { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
.checkbox input { width: auto; }
.toast { position: fixed; right: 20px; bottom: 20px; max-width: min(420px, calc(100vw - 40px)); padding: 10px 14px; color: #fff; border-radius: 6px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .15s, transform .15s; z-index: 20; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #238636; }
.toast.error { background: var(--red); }
@media (max-width: 760px) {
  .app { padding: 20px 13px 40px; }
  .topbar, .panel-header, .credential-main { display: block; }
  .top-actions, .actions { justify-content: flex-start; margin-top: 13px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .credential-actions { margin-top: 12px; justify-content: flex-start; flex-wrap: wrap; }
  .settings-grid, .modal .form-grid, .integration-grid { grid-template-columns: 1fr; }
  .quota-windows { grid-template-columns: 1fr; }
  .form-group.full { grid-column: auto; }
  .panel { padding: 15px; }
  th, td { padding: 8px 6px; }
}
@media (max-width: 430px) { .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="loginView" class="login-wrap hidden">
  <form class="login-box" onsubmit="doLogin(event)">
    <h1>NA2H</h1>
    <p data-zh="输入 Bearer token 进入本地控制台。" data-en="Enter your Bearer token to open the local console.">输入 Bearer token 进入本地控制台。</p>
    <input id="loginToken" type="password" autocomplete="current-password" placeholder="Bearer token">
    <label class="remember-login"><input id="rememberLogin" type="checkbox"><span data-zh="在此浏览器中保持登录" data-en="Stay signed in on this browser">在此浏览器中保持登录</span></label>
    <button class="btn-blue" type="submit" style="width:100%" data-zh="登录" data-en="Sign in">登录</button>
    <div class="preferences login-preferences">
      <label class="preference-control"><span data-zh="语言" data-en="Language">语言</span><select class="language-select" onchange="setLanguage(this.value)"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
      <label class="preference-control"><span data-zh="主题" data-en="Theme">主题</span><select class="theme-select" onchange="setTheme(this.value)"><option value="system" data-zh="跟随系统" data-en="System">跟随系统</option><option value="light" data-zh="浅色" data-en="Light">浅色</option><option value="dark" data-zh="深色" data-en="Dark">深色</option></select></label>
    </div>
  </form>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div>
      <p class="eyebrow">NA2H</p>
      <h1 data-zh="控制台" data-en="Console">控制台</h1>
      <p class="subtitle" data-zh="管理凭证池、检查连接，并查看代理用量。" data-en="Manage credentials, check connectivity, and review gateway usage.">管理凭证池、检查连接，并查看代理用量。</p>
      <p class="endpoint" id="endpoint">Endpoint: —</p>
    </div>
    <div class="top-actions">
      <span class="service" id="serviceStatus"><span class="service-dot"></span><span data-zh="检查中" data-en="Checking">检查中</span></span>
      <div class="preferences">
        <label class="preference-control"><span data-zh="语言" data-en="Language">语言</span><select id="languageSelect" class="language-select" onchange="setLanguage(this.value)"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
        <label class="preference-control"><span data-zh="主题" data-en="Theme">主题</span><select id="themeSelect" class="theme-select" onchange="setTheme(this.value)"><option value="system" data-zh="跟随系统" data-en="System">跟随系统</option><option value="light" data-zh="浅色" data-en="Light">浅色</option><option value="dark" data-zh="深色" data-en="Dark">深色</option></select></label>
      </div>
      <button class="btn-ghost" onclick="refreshAll()" data-zh="刷新" data-en="Refresh">刷新</button>
      <button class="btn-ghost" onclick="logout()" data-zh="退出" data-en="Sign out">退出</button>
    </div>
  </header>

  <section class="panel onboarding" id="onboarding" aria-live="polite">
    <div id="onboardingContent"><h2 data-zh="下一步" data-en="Next step">下一步</h2><p data-zh="正在检查本地设置…" data-en="Checking local configuration…">正在检查本地设置…</p></div>
  </section>

  <div class="stats" id="stats"></div>

  <section class="panel" id="credentials">
    <div class="panel-header">
      <div><h2 data-zh="凭证" data-en="Credentials">凭证</h2><p data-zh="编辑时密钥不会回显；密钥输入框留空即可保持当前值。" data-en="Secrets are never echoed while editing; leave a secret field blank to keep its current value.">编辑时密钥不会回显；密钥输入框留空即可保持当前值。</p></div>
      <div class="actions">
        <button class="btn-primary" onclick="openCredentialModal('aistudio')">+ AI Studio</button>
        <button class="btn-blue" onclick="startAntigravityOAuth()" data-zh="+ Antigravity 登录" data-en="+ Antigravity sign-in">+ Antigravity 登录</button>
        <button class="btn-ghost" onclick="openCredentialModal('antigravity')" data-zh="手动配置" data-en="Manual setup">手动配置</button>
        <button class="btn-ghost" onclick="openCredentialMigrationModal()" data-zh="凭证迁移" data-en="Credential migration">凭证迁移</button>
      </div>
    </div>
    <div class="provider-block">
      <div class="provider-heading"><h3>AI Studio</h3><span id="aiCount" data-zh="0 个凭证" data-en="0 credentials">0 个凭证</span></div>
      <div class="credential-list" id="aiCredentials"></div>
    </div>
    <div class="provider-block">
      <div class="provider-heading"><h3>Antigravity</h3><span id="agCount" data-zh="0 个账号" data-en="0 accounts">0 个账号</span></div>
      <div class="credential-list" id="agCredentials"></div>
    </div>
  </section>

  <section class="panel" id="usage">
    <div class="panel-header"><div><h2 data-zh="用量" data-en="Usage">用量</h2><p data-zh="本地 token 计量和 API 等价成本估算；不是 Antigravity 实际账单。" data-en="Local token metering and API-equivalent cost estimates; not an Antigravity bill.">本地 token 计量和 API 等价成本估算；不是 Antigravity 实际账单。</p></div><button class="btn-ghost" onclick="loadUsage()" data-zh="刷新用量" data-en="Refresh usage">刷新用量</button></div>
    <div id="usageStats" class="stats"></div>
    <div class="table-wrap" id="usageTable"></div>
  </section>

  <section class="panel" id="settings">
    <details id="settingsDetails">
      <summary data-zh="设置（部分变更需要重启）" data-en="Settings (some changes require restart)">设置（部分变更需要重启）</summary>
      <div class="settings-grid">
        <div class="form-group"><label for="setHost">Host</label><input id="setHost"></div>
        <div class="form-group"><label for="setPort">Port</label><input id="setPort" type="number"></div>
        <div class="form-group full"><label for="setAuth">Bearer token</label><input id="setAuth" type="password" autocomplete="new-password" placeholder="留空：保持现有密钥" data-placeholder-zh="留空：保持现有密钥" data-placeholder-en="Leave blank to keep the current secret"></div>
        <div class="form-group"><label for="setRetries" data-zh="最大重试次数" data-en="Max retries">最大重试次数</label><input id="setRetries" type="number"></div>
        <div class="form-group"><label for="setCooldown" data-zh="冷却秒数" data-en="Cooldown seconds">冷却秒数</label><input id="setCooldown" type="number"></div>
        <div class="form-group full"><label for="setDb" data-zh="数据库路径" data-en="Database path">数据库路径</label><input id="setDb"></div>
        <div class="form-group full"><label for="setProxy" data-zh="上游代理" data-en="Upstream proxy">上游代理</label><input id="setProxy" placeholder="留空：自动检测环境/系统/GNOME 代理" data-placeholder-zh="留空：自动检测环境/系统/GNOME 代理" data-placeholder-en="Leave blank to auto-detect environment, system, or GNOME proxy"></div>
        <div class="form-group full"><label for="setProxySource" data-zh="代理来源" data-en="Proxy source">代理来源</label><input id="setProxySource" readonly></div>
        <div class="form-group full"><label for="setConfigFile" data-zh="配置文件" data-en="Config file">配置文件</label><input id="setConfigFile" readonly></div>
        <div class="form-group full"><label for="setDiagnostics" data-zh="诊断日志" data-en="Diagnostic journal">诊断日志</label><input id="setDiagnostics" readonly></div>
      </div>
      <div class="form-actions"><button class="btn-primary" onclick="saveSettings()" data-zh="保存设置" data-en="Save settings">保存设置</button></div>
    </details>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
function storedPreference(key, fallback) {
  try { return localStorage.getItem(key) || fallback; }
  catch (error) { return fallback; }
}
function savePreference(key, value) {
  try { localStorage.setItem(key, value); }
  catch (error) { /* Preferences remain active for this page load. */ }
}
const browserLanguage = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
let language = storedPreference('na2h-language', browserLanguage);
let theme = storedPreference('na2h-theme', 'system');
function tr(chinese, english) { return language === 'en' ? english : chinese; }
function applyTranslations() {
  document.documentElement.lang = language;
  document.querySelectorAll('[data-zh][data-en]').forEach(node => {
    node.textContent = language === 'en' ? node.dataset.en : node.dataset.zh;
  });
  document.querySelectorAll('[data-placeholder-zh][data-placeholder-en]').forEach(node => {
    node.placeholder = language === 'en' ? node.dataset.placeholderEn : node.dataset.placeholderZh;
  });
  document.querySelectorAll('.language-select').forEach(node => { node.value = language; });
}
function renderLocalizedState() {
  if (!state.health || document.getElementById('appView').classList.contains('hidden')) return;
  renderHealth(); renderCredentials(); renderUsage(); renderOnboarding();
  if (state.config) renderSettingsCopy();
}
function setLanguage(value) {
  language = ['zh-CN', 'en'].includes(value) ? value : 'zh-CN';
  savePreference('na2h-language', language);
  applyTranslations();
  renderLocalizedState();
}
function setTheme(value) {
  theme = ['system', 'light', 'dark'].includes(value) ? value : 'system';
  savePreference('na2h-theme', theme);
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('.theme-select').forEach(node => { node.value = theme; });
}
function applyPreferences() {
  setTheme(theme);
  setLanguage(language);
}

const state = { credentials: { aistudio: [], antigravity: [] }, models: [], usage: null, health: null, config: null, busy: new Set(), tests: {}, verifications: {} };
let token = sessionStorage.getItem('hakimi_token') || localStorage.getItem('hakimi_token') || '';
let editingType = '';
let editingId = '';
let oauthSession = null;
let pendingCredentialBundle = null;

async function api(method, path, body) {
  const options = { method, headers: {} };
  if (token) options.headers.Authorization = 'Bearer ' + token;
  if (body !== undefined) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  if (response.status === 401) { showLogin(); const error = new Error(tr('未授权', 'Unauthorized')); error.code = 'unauthorized'; throw error; }
  const data = await response.json();
  if (!response.ok) { const error = new Error(data.error?.message || tr('请求失败', 'Request failed')); error.data = data; throw error; }
  return data;
}

function showLogin() {
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
}
function doLogin(event) {
  event?.preventDefault();
  token = document.getElementById('loginToken').value.trim();
  sessionStorage.setItem('hakimi_token', token);
  if (document.getElementById('rememberLogin').checked) localStorage.setItem('hakimi_token', token);
  else localStorage.removeItem('hakimi_token');
  init();
}
function logout() {
  token = '';
  sessionStorage.removeItem('hakimi_token');
  localStorage.removeItem('hakimi_token');
  document.getElementById('loginToken').value = '';
  showLogin();
}
function setAppVisible() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
}

async function init() {
  try {
    state.health = await api('GET', '/healthz');
    if (state.health.auth_enabled && !token) { showLogin(); return; }
    setAppVisible(); await refreshAll();
  }
  catch (error) {
    if (error.code === 'unauthorized') return;
    setAppVisible(); toast(error.message, 'error');
  }
}
async function refreshAll() {
  try {
    const [health, credentials, usage, models] = await Promise.all([
      api('GET', '/healthz'), api('GET', '/api/credentials'), api('GET', '/api/usage/summary'), api('GET', '/v1/models'),
    ]);
    state.health = health; state.credentials = credentials; state.usage = usage; state.models = models.data || [];
    renderHealth(); renderCredentials(); renderUsage(); renderOnboarding();
    document.getElementById('endpoint').textContent = `OpenAI Base URL: ${window.location.origin}/v1`;
  } catch (error) { toast(error.message, 'error'); }
}
function recommendedModel() {
  const ids = new Set((state.models || []).map(model => model.id));
  if ((state.credentials.antigravity || []).length) {
    const id = ['gemini-3.8-flash-tiered', 'gemini-3.8-flash', 'gemini-3.7-flash-tiered', 'gemini-3.7-flash']
      .find(candidate => ids.has(candidate)) || 'gemini-3.8-flash-tiered';
    return `antigravity/${id}`;
  }
  if (ids.has('gemini-3.8-flash')) return 'gemini-3.8-flash';
  if (ids.has('gemini-3.7-flash')) return 'gemini-3.7-flash';
  return state.models?.[0]?.id || 'gemini-2.5-flash';
}
function integrationConfig(apiKey) {
  return {
    base_url: `${window.location.origin}/v1`,
    api_key: apiKey,
    model: recommendedModel(),
  };
}
function renderOnboarding() {
  const panel = document.getElementById('onboarding');
  const content = document.getElementById('onboardingContent');
  const ai = state.credentials.aistudio || [];
  const ag = state.credentials.antigravity || [];
  const total = ai.length + ag.length;
  const active = Number(state.health?.active_credentials || 0);
  panel.classList.toggle('ready', active > 0);
  if (!total) {
    content.innerHTML = `<h2>${tr('第 1 步：登录一个账号', 'Step 1: Sign in to an account')}</h2><p>${tr('推荐使用 Antigravity 浏览器登录；无需手填 client ID、secret、refresh token 或 Project ID。', 'Antigravity browser sign-in is recommended; no manual client ID, secret, refresh token, or Project ID is required.')}</p><div class="actions"><button class="btn-blue" onclick="startAntigravityOAuth()">${tr('Antigravity 登录', 'Antigravity sign-in')}</button><button class="btn-ghost" onclick="openCredentialModal('aistudio')">${tr('添加 AI Studio key', 'Add AI Studio key')}</button></div>`;
    return;
  }
  if (!active) {
    content.innerHTML = `<h2>${tr('凭证尚不可调度', 'No credentials are schedulable')}</h2><p>${tr('账号已保存，但当前没有可用凭证。请在下方凭证卡片运行“检查”，按失败阶段重新登录或等待冷却结束。', 'Accounts are saved, but none are currently available. Run Check on a credential card, then sign in again or wait for cooldown based on the failed stage.')}</p><div class="actions"><button class="btn-ghost" onclick="document.getElementById('credentials').scrollIntoView({behavior:'smooth'})">${tr('查看凭证状态', 'View credential status')}</button></div>`;
    return;
  }
  const config = integrationConfig('');
  const authEnabled = Boolean(state.health?.auth_enabled);
  const authNote = authEnabled
    ? tr('登录密钥同时也是客户端 API key；页面不显示它，仅在点击复制时写入剪贴板。', 'The sign-in secret is also the client API key. It is never displayed and is written to the clipboard only when you click Copy.')
    : tr('当前未启用 Bearer 鉴权，仅适合本机回环使用；客户端 API key 可暂填任意非空值。暴露到局域网或服务器前请先设置 token 并重启。', 'Bearer authentication is disabled, which is suitable only for local loopback use. Use any non-empty client API key for now; set a token and restart before exposing NA2H to a LAN or server.');
  const authAction = authEnabled ? '' : `<button class="btn-ghost" onclick="openSettings()">${tr('设置 Bearer token', 'Set Bearer token')}</button>`;
  content.innerHTML = `<h2>${tr('已可接入', 'Ready to connect')}${authEnabled ? '' : tr('（未启用鉴权）', ' (authentication disabled)')}</h2><p>${tr('NA2H 已准备好作为 OpenAI-compatible provider。', 'NA2H is ready to use as an OpenAI-compatible provider.')} ${authNote}</p><div class="integration-grid"><div class="integration-item"><span>Base URL</span><code>${esc(config.base_url)}</code></div><div class="integration-item"><span>Model</span><code>${esc(config.model)}</code></div></div><div class="actions"><button class="btn-primary" onclick="copyIntegrationConfig()">${tr('复制通用配置', 'Copy generic config')}</button>${authAction}<button class="btn-ghost" onclick="document.getElementById('credentials').scrollIntoView({behavior:'smooth'})">${tr('检查账号', 'Check accounts')}</button></div>`;
}
async function copyIntegrationConfig() {
  try {
    const apiKey = state.health?.auth_enabled ? token : '<ANY_NON_EMPTY_VALUE>';
    if (state.health?.auth_enabled && !apiKey) { showLogin(); return; }
    await navigator.clipboard.writeText(JSON.stringify(integrationConfig(apiKey), null, 2));
    toast(tr('通用配置已复制，包含敏感 API key，请勿分享', 'Generic config copied. It contains a sensitive API key; do not share it.'), 'success');
  } catch (error) { toast(tr('复制失败，请手动复制 Base URL 和模型', 'Copy failed. Copy the Base URL and model manually.'), 'error'); }
}
function renderHealth() {
  const health = state.health || {};
  const status = document.getElementById('serviceStatus');
  status.className = 'service online';
  status.innerHTML = `<span class="service-dot"></span><span>${tr('在线', 'Online')} · ${health.active_credentials || 0}/${health.total_credentials || 0} ${tr('可调度', 'active')} · ${tr('代理', 'proxy')} ${esc(health.proxy_source || 'unknown')}</span>`;
  const usage = state.usage || {};
  const totalTokens = (usage.total_input_tokens || 0) + (usage.total_cache_read_tokens || 0)
    + (usage.total_cache_write_tokens || 0) + (usage.total_output_tokens || 0)
    + (usage.total_reasoning_tokens || 0);
  document.getElementById('stats').innerHTML = [
    [tr('可调度凭证', 'Active credentials'), `${health.active_credentials || 0}/${health.total_credentials || 0}`, tr('当前可调度', 'Currently schedulable')],
    [tr('请求数', 'Requests'), formatNum(usage.total_requests), tr('全部本地计量', 'All local metering')],
    [tr('Token 数', 'Tokens'), formatNum(totalTokens), `${formatNum(usage.total_input_tokens)} ${tr('输入', 'input')} / ${formatNum(usage.total_cache_read_tokens)} ${tr('缓存', 'cached')} / ${formatNum(usage.total_reasoning_tokens)} ${tr('推理', 'reasoning')}`],
    [tr('API 等价成本', 'API-equivalent cost'), formatUsd(usage.total_cost_usd), tr('估算值 · 非 AGY 账单', 'Estimate · not an AGY bill')],
  ].map(item => `<div class="stat"><div class="stat-label">${item[0]}</div><div class="stat-value">${item[1]}</div><div class="stat-sub">${item[2]}</div></div>`).join('');
}

async function loadCredentials() {
  const [health, credentials, models] = await Promise.all([
    api('GET', '/healthz'), api('GET', '/api/credentials'), api('GET', '/v1/models'),
  ]);
  state.health = health; state.credentials = credentials; state.models = models.data || [];
  renderHealth(); renderCredentials(); renderOnboarding();
}
function renderCredentials() {
  const ai = state.credentials.aistudio || [];
  const ag = state.credentials.antigravity || [];
  document.getElementById('aiCount').textContent = language === 'en' ? `${ai.length} credentials` : `${ai.length} 个凭证`;
  document.getElementById('agCount').textContent = language === 'en' ? `${ag.length} accounts` : `${ag.length} 个账号`;
  document.getElementById('aiCredentials').innerHTML = renderCredentialList('aistudio', ai);
  document.getElementById('agCredentials').innerHTML = renderCredentialList('antigravity', ag);
}
function renderCredentialList(kind, credentials) {
  if (!credentials.length) {
    const label = kind === 'aistudio' ? 'AI Studio API key' : tr('Antigravity OAuth 账号', 'Antigravity OAuth account');
    return `<div class="empty">${tr(`还没有${label}。`, `No ${label} yet.`)}<p>${tr('点击右上角按钮添加。', 'Use the buttons above to add one.')}</p></div>`;
  }
  return credentials.map(credential => {
    const key = `${kind}:${credential.id}`;
    const quotaKey = `quota:${credential.id}`;
    const verifyKey = `verify:${credential.id}`;
    const result = state.tests[key];
    const verification = state.verifications[credential.id];
    const tokenExpiry = kind === 'antigravity'
      ? (credential.access_token_expires_at ? `access token ${tr('有效至', 'expires')} ${new Date(credential.access_token_expires_at * 1000).toLocaleString(language)}` : tr('access token 按需刷新', 'access token refreshes on demand'))
      : '';
    const detail = kind === 'aistudio'
      ? [credential.api_key_set ? tr('API key 已设置', 'API key set') : tr('API key 缺失', 'API key missing'), credential.account, credential.project]
      : [credential.account || credential.client_id, credential.client_secret_set ? tr('client secret 已设置', 'client secret set') : tr('公开客户端（无 secret）', 'Public client (no secret)'), credential.refresh_token_set ? tr('refresh token 已设置', 'refresh token set') : tr('refresh token 缺失', 'refresh token missing'), tokenExpiry, credential.project];
    const runtime = [
      credential.in_flight ? tr(`${credential.in_flight} 个请求处理中`, `${credential.in_flight} requests in flight`) : tr('空闲', 'Idle'),
      `${tr('健康：', 'Health: ')}${healthLabel(credential.health)}`,
      credential.cooldown_remaining ? `${tr('冷却', 'Cooldown')} ${credential.cooldown_remaining}s` : '',
      credential.last_latency_ms ? `${credential.last_latency_ms} ms` : '',
      credential.last_model ? `${tr('模型', 'Model')} ${credential.last_model}` : '',
      credential.last_tested_at ? `${tr('检查：', 'Check: ')}${credential.last_test_ok ? tr('通过', 'passed') : tr('失败', 'failed')}${language === 'en' ? ` (${relativeAge(credential.last_tested_at)})` : `（${relativeAge(credential.last_tested_at)}）`}` : tr('未检查', 'Not checked'),
    ].filter(Boolean).map(esc).join(' · ');
    const lastError = credential.last_error_type
      ? `<div class="runtime-error">${tr('最近错误：', 'Latest error: ')}${esc(credential.last_error_type)}${credential.last_error_message ? ` · ${esc(credential.last_error_message)}` : ''}</div>`
      : '';
    const quota = kind === 'antigravity' ? renderQuotaSnapshot(credential.quota) : '';
    return `<article class="credential-card">
      <div class="credential-main">
        <div><div class="credential-name">${esc(credential.id)}</div><div class="credential-meta">${detail.filter(Boolean).map(esc).map(value => `<span>${value}</span>`).join('')}</div></div>
        <div class="credential-actions">
          ${stateBadge(credential.state)}
          <button class="btn-ghost" ${state.busy.has(key) ? 'disabled' : ''} onclick="testCredential('${kind}','${arg(credential.id)}')">${state.busy.has(key) ? tr('检查中…', 'Checking…') : tr('检查', 'Check')}</button>
          ${kind === 'antigravity' ? `<button class="btn-ghost" ${state.busy.has(quotaKey) ? 'disabled' : ''} onclick="refreshAntigravityQuota('${arg(credential.id)}')">${state.busy.has(quotaKey) ? tr('刷新中…', 'Refreshing…') : tr('刷新额度', 'Refresh quota')}</button>` : ''}
          ${kind === 'antigravity' ? `<button class="btn-blue" ${state.busy.has(verifyKey) ? 'disabled' : ''} onclick="verifyCredential('${arg(credential.id)}')">${state.busy.has(verifyKey) ? tr('自检中…', 'Verifying…') : tr('完整自检', 'Full verification')}</button>` : ''}
          <button class="btn-ghost" onclick="openCredentialModal('${kind}','${arg(credential.id)}')">${tr('编辑', 'Edit')}</button>
          <button class="btn-danger" onclick="deleteCredential('${kind}','${arg(credential.id)}')">${tr('删除', 'Delete')}</button>
        </div>
      </div>
      <div class="credential-runtime">${runtime}${lastError}</div>
      ${quota}
      ${result ? `<div class="test-result ${result.ok ? 'ok' : 'error'}">${esc(testResultMessage(result))}</div>` : ''}
      ${verification ? `<div class="test-result ${verification.ok ? 'ok' : 'error'} verification-result"><span>${esc(verificationResultMessage(verification))}</span>${verification.report ? `<button class="btn-ghost" onclick="downloadVerificationReport('${arg(credential.id)}')">${tr('下载脱敏报告', 'Download redacted report')}</button>` : ''}</div>` : ''}
    </article>`;
  }).join('');
}
function renderQuotaSnapshot(quota) {
  if (!quota) return `<div class="quota-panel"><div class="quota-meta">${tr('尚未获取 AGY 额度；点击“刷新额度”主动查询。', 'AGY quota has not been fetched. Click Refresh quota to query it explicitly.')}</div></div>`;
  const updated = quota.fetched_at ? relativeAge(quota.fetched_at) : tr('未知', 'Unknown');
  const source = esc(quota.source || 'unknown');
  const group = (quota.groups || []).find(item => item.kind === 'gemini');
  if (quota.mode !== 'grouped' || !group) {
    const modelCount = (quota.models || []).length;
    return `<div class="quota-panel"><div class="quota-panel-head"><div><div class="quota-kicker">${tr('Gemini 共享池', 'Gemini shared pool')}</div><div class="quota-title">${tr('共享额度暂不可用', 'Shared quota unavailable')}</div></div><div class="quota-source">${source} · ${esc(updated)}</div></div><div class="quota-fallback">${tr('Google 未返回完整的 5h / 7d 共享额度。', 'Google did not return complete 5h / 7d shared quota data.')}${modelCount ? tr(`已检测到 ${modelCount} 个可用 Gemini 模型，但不会把逐模型数据伪装成独立额度池。`, `${modelCount} available Gemini models were detected, but per-model data is not presented as independent quota pools.`) : tr('当前仅能确认账号连接状态。', 'Only account connectivity can currently be confirmed.')}</div></div>`;
  }
  const buckets = [...(group.buckets || [])].sort((a, b) => quotaWindowRank(a) - quotaWindowRank(b));
  const windows = buckets.map(bucket => {
    const percent = Math.max(0, Math.min(100, Number(bucket.remaining_percent) || 0));
    const label = quotaWindowLabel(bucket);
    const tone = percent >= 70 ? 'quota-good' : percent >= 30 ? 'quota-warn' : 'quota-critical';
    const reset = bucket.reset_time ? `${tr('重置于', 'Resets')} ${formatTimestamp(bucket.reset_time)}` : tr('重置时间未知', 'Reset time unknown');
    return `<div class="quota-window ${tone}"><div class="quota-window-head"><span class="quota-window-label">${esc(label)}</span><span class="quota-window-value">${percent}%</span></div><div class="quota-progress-track" role="progressbar" aria-label="${esc(label)} ${tr('剩余额度', 'quota remaining')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><div class="quota-progress-fill" style="width:${percent}%"></div></div><div class="quota-reset">${esc(reset)}</div></div>`;
  }).join('');
  return `<div class="quota-panel"><div class="quota-panel-head"><div><div class="quota-kicker">${tr('Gemini 共享池', 'Gemini shared pool')}</div><div class="quota-title">${esc(group.display_name || 'Gemini Models')}</div></div><div class="quota-source">${source} · ${esc(updated)}</div></div><div class="quota-windows">${windows || `<div class="quota-fallback">${tr('上游没有返回可展示的共享额度窗口。', 'The upstream service returned no displayable shared quota windows.')}</div>`}</div><div class="quota-meta">${tr('Google 上游报告值 · 共享池余量，不代表单个模型拥有独立配额。', 'Values reported by Google upstream · shared-pool remaining quota, not independent per-model quotas.')}</div></div>`;
}
function quotaWindowText(bucket) {
  return `${bucket.bucket_id || ''} ${bucket.window || ''} ${bucket.display_name || ''}`.toLowerCase();
}
function quotaWindowRank(bucket) {
  const text = quotaWindowText(bucket);
  if (text.includes('5h') || text.includes('session')) return 0;
  if (text.includes('weekly') || text.includes('week') || text.includes('7d')) return 1;
  return 2;
}
function quotaWindowLabel(bucket) {
  const text = quotaWindowText(bucket);
  if (text.includes('5h') || text.includes('session')) return '5h';
  if (text.includes('weekly') || text.includes('week') || text.includes('7d')) return '7d / Weekly';
  return bucket.display_name || bucket.window || bucket.bucket_id || 'Quota';
}
function formatTimestamp(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString(language);
}
function healthLabel(name) {
  const labels = language === 'en'
    ? { healthy: 'Healthy', degraded: 'Degraded', cooldown: 'Cooldown', reauth_required: 'Sign-in required', disabled: 'Disabled', unknown: 'Unknown' }
    : { healthy: '正常', degraded: '降级', cooldown: '冷却', reauth_required: '需重新授权', disabled: '已禁用', unknown: '未知' };
  return labels[name] || name || labels.unknown;
}
function relativeAge(timestamp) {
  const seconds = Math.max(0, Math.round(Date.now() / 1000 - Number(timestamp)));
  if (seconds < 60) return language === 'en' ? `${seconds}s ago` : `${seconds}s 前`;
  if (seconds < 3600) return language === 'en' ? `${Math.round(seconds / 60)}m ago` : `${Math.round(seconds / 60)}m 前`;
  return language === 'en' ? `${Math.round(seconds / 3600)}h ago` : `${Math.round(seconds / 3600)}h 前`;
}
function stateBadge(stateName) {
  const map = language === 'en'
    ? { active: ['badge-active', 'Active'], cooldown: ['badge-cooldown', 'Cooldown'], disabled: ['badge-disabled', 'Disabled'] }
    : { active: ['badge-active', '可调度'], cooldown: ['badge-cooldown', '冷却中'], disabled: ['badge-disabled', '已禁用'] };
  const [className, label] = map[stateName] || ['badge-unknown', stateName || tr('未知', 'Unknown')];
  return `<span class="badge ${className}">${esc(label)}</span>`;
}
function stageLabel(name) {
  const labels = language === 'en'
    ? { local: 'Local', oauth: 'OAuth', control_plane: 'Control plane', quota: 'Quota', inference: 'Inference', responses_nonstream: 'Non-stream response', responses_stream: 'Streamed tool call', agent_replay: 'Agent replay' }
    : { local: '本地', oauth: 'OAuth', control_plane: '控制面', quota: '额度', inference: '推理', responses_nonstream: '非流式响应', responses_stream: '流式工具调用', agent_replay: 'Agent 回放' };
  return labels[name] || name;
}
function testResultMessage(result) {
  if (result.ok) {
    const stages = (result.stages || []).map(stageLabel).join(' → ');
    return `${tr('检查通过', 'Check passed')} · ${stages || result.model || ''} · ${result.latency} ms`;
  }
  const failedStage = result.failedStage ? (language === 'en' ? ` (${stageLabel(result.failedStage)})` : `（${stageLabel(result.failedStage)}）`) : '';
  return `${tr('检查失败', 'Check failed')}${failedStage} · ${result.errorMessage}`;
}
function verificationResultMessage(result) {
  if (result.ok) return `${tr('完整自检通过', 'Full verification passed')} · ${tr('3 次推理', '3 inference requests')} · ${result.durationMs || 0} ms`;
  if (result.errorMessage) return `${tr('完整自检失败', 'Full verification failed')} · ${result.errorMessage}`;
  const failed = (result.failedStages || []).map(stageLabel).join(language === 'en' ? ', ' : '、');
  return `${tr('完整自检未通过', 'Full verification did not pass')}${failed ? ` · ${failed}` : ''}`;
}

async function submitAntigravityOAuth() {
  const result = value('oauthResult');
  if (!result) { oauthStatus(tr('请粘贴完整回调 URL 或 OAuth code。', 'Paste the complete callback URL or OAuth code.')); return; }
  const button = document.getElementById('oauthComplete');
  button.disabled = true;
  oauthStatus(tr('正在交换 OAuth token…', 'Exchanging OAuth token…'));
  try {
    const payload = result.startsWith('http://') || result.startsWith('https://')
      ? { state: oauthSession.state, callback_url: result }
      : { state: oauthSession.state, code: result };
    const response = await api('POST', '/api/credentials/antigravity/oauth/complete', payload);
    if (response.status === 'ok') {
      oauthSession.completed = true;
      closeModal();
      toast(`${tr('Antigravity 登录成功', 'Antigravity sign-in succeeded')} · ${response.account || response.credential_id}`, 'success');
      await loadCredentials();
    } else if (response.status === 'error') { oauthSession.completed = true; oauthStatus(response.message || tr('OAuth 登录失败。', 'OAuth sign-in failed.')); }
    else oauthStatus(tr('服务器仍在处理，请稍候。', 'The server is still processing. Please wait.'));
  } catch (error) { oauthStatus(error.message); }
  finally { button.disabled = false; }
}

async function pollAntigravityOAuth(session) {
    const pollIntervalMs = 3000;
    const maxAttempts = Math.ceil(((session.expires_in || 300) * 1000) / pollIntervalMs);
    for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
      if (session.completed) return;
      await new Promise(resolve => setTimeout(resolve, pollIntervalMs));
      if (session.completed) return;
      try {
        const result = await api('GET', `/api/credentials/antigravity/oauth/status/${encodeURIComponent(session.state)}`);
        if (result.status === 'ok') {
          session.completed = true;
          closeModal();
          toast(`${tr('Antigravity 登录成功', 'Antigravity sign-in succeeded')} · ${result.account || result.credential_id}`, 'success');
          await loadCredentials();
          return;
        }
        if (result.status === 'error') { session.completed = true; oauthStatus(result.message || tr('OAuth 登录失败。', 'OAuth sign-in failed.')); return; }
        if (result.status === 'processing') oauthStatus(tr('服务器正在交换 OAuth token…', 'The server is exchanging the OAuth token…'));
      } catch (error) { oauthStatus(error.message); return; }
    }
    oauthStatus(tr('OAuth 登录超时，请重新开始。', 'OAuth sign-in timed out. Start again.'));
}

async function testCredential(kind, encodedId) {

  try {

  const credentialRows = (summary.by_credential || []).map(row => usageRow(row, row.credential_id));
  const modelRows = (summary.by_model || []).map(row => usageRow(row, row.model));
  const headers = [tr('名称', 'Name'), tr('请求数', 'Requests'), tr('输入', 'Input'), tr('缓存输入', 'Cached input'), tr('缓存写入', 'Cache write'), tr('输出', 'Output'), tr('推理', 'Reasoning'), tr('API 等价成本', 'API-equivalent cost')];
  document.getElementById('usageTable').innerHTML = `<h3 style="font-size:14px">${tr('按凭证', 'By credential')}</h3>${tableHtml(headers, credentialRows)}<h3 style="margin:22px 0 8px;font-size:14px">${tr('按模型', 'By model')}</h3>${tableHtml(headers, modelRows)}`;
}
function formatUsd(value) {
  const amount = Number(value || 0);
  if (amount > 0 && amount < 0.000001) return '$&lt;0.000001';
  return '$' + amount.toFixed(6);
}
function tableHtml(headers, rows) {
  if (!rows.length) return `<div class="empty">${tr('还没有用量数据', 'No usage data yet')}</div>`;
  return `<table><thead><tr>${headers.map(esc).map(item => `<th>${item}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

let settingsLoaded = false;
document.getElementById('settingsDetails').addEventListener('toggle', event => { if (event.target.open && !settingsLoaded) loadSettings(); });
function openSettings() {
  const details = document.getElementById('settingsDetails');
  details.open = true;
  details.scrollIntoView({behavior: 'smooth'});
}
async function loadSettings() {
  try {
    const config = await api('GET', '/api/config');
    state.config = config;
    document.getElementById('setHost').value = config.host || ''; document.getElementById('setPort').value = config.port || '';
    document.getElementById('setAuth').value = ''; document.getElementById('setRetries').value = config.max_retries || 3;
    document.getElementById('setCooldown').value = config.cooldown_seconds || 60; document.getElementById('setDb').value = config.db_path || '';
    document.getElementById('setProxy').value = config.proxy || ''; document.getElementById('setProxySource').value = config.proxy_source || 'unknown'; document.getElementById('setConfigFile').value = config.config_file || '';
    renderSettingsCopy(); settingsLoaded = true;
  } catch (error) { toast(error.message, 'error'); }
}
function renderSettingsCopy() {
  const config = state.config || {};
  document.getElementById('setAuth').placeholder = config.auth_token_set ? tr('留空：保持现有密钥', 'Leave blank to keep the current secret') : tr('请设置部署密钥', 'Set a deployment secret');
  const diagnostics = state.health?.diagnostics || {};
  document.getElementById('setDiagnostics').value = diagnostics.enabled ? diagnostics.path : tr('已禁用', 'Disabled');
}
async function saveSettings() {
  try {
    const body = { host: value('setHost') || '127.0.0.1', port: Number(value('setPort')) || 12345, max_retries: Number(value('setRetries')) || 3, cooldown_seconds: Number(value('setCooldown')) || 60, db_path: value('setDb') || 'hakimi.db', proxy: value('setProxy') };
    if (value('setAuth')) body.auth_token = value('setAuth');
    const saved = await api('PUT', '/api/config', body);
    document.getElementById('setAuth').value = '';
    document.getElementById('setProxySource').value = saved.proxy_source || 'unknown';
    state.config = { ...(state.config || {}), ...saved };
    toast(tr('设置已保存，Host/Port/Bearer token/数据库变更需重启', 'Settings saved. Host, Port, Bearer token, and database changes require restart.'), 'success');
  } catch (error) { toast(error.message, 'error'); }
}

function formatNum(number) { return Number(number || 0).toLocaleString(language); }
function esc(valueToEscape) { const node = document.createElement('div'); node.textContent = valueToEscape == null ? '' : String(valueToEscape); return node.innerHTML; }
function arg(valueToEncode) { return encodeURIComponent(valueToEncode); }
function toast(message, type) { const node = document.getElementById('toast'); node.textContent = message; node.className = `toast ${type} show`; clearTimeout(toast.timer); toast.timer = setTimeout(() => node.classList.remove('show'), 3200); }
applyPreferences();
init();
</script>
</body>
</html>
